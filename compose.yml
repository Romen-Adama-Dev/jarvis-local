name: jarvis-local

networks:
  jarvis_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

services:
  postgres:
    image: postgres:17.2-bookworm
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  searxng:
    image: searxng/searxng@sha256:11ffedd387dc9cf99e881250c67861470384e55194a86f76df76aa0034a28a1a
    restart: unless-stopped
    profiles: ["assistant"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT:-8888}/"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?falta SEARXNG_SECRET en .env}
    volumes:
      - ./infra/compose/searxng:/etc/searxng
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
    restart: unless-stopped
    profiles: ["assistant"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT:-5000}:5000"
    environment:
      BASE_URL: "http://127.0.0.1:${CHANGEDETECTION_PORT:-5000}"
    volumes:
      - ./infra/compose/changedetection:/datastore
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  n8n:
    image: n8nio/n8n:1.71.0
    restart: unless-stopped
    profiles: ["automation"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ./infra/compose/n8n_data:/home/node/.n8n

  webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: unless-stopped
    profiles: ["webui"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ANONYMIZED_TELEMETRY: "false"
      OFFLINE_MODE: "true"
    volumes:
      - ./infra/compose/webui_data:/app/backend/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    profiles: ["monitoring"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["monitoring"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infra/monitoring/grafana:/var/lib/grafana
