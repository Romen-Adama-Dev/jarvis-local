# Jarvis Local: `docker compose up -d` levanta el asistente completo (ver docs/DOCKER.md).
#
# Requisitos: Docker Engine con Compose v2.30+ y, para GPU, NVIDIA Container Toolkit
# (sin GPU: docker compose -f compose.yml -f compose.cpu.yml up -d).
# Configuración obligatoria para usar Telegram: TELEGRAM_BOT_TOKEN y
# TELEGRAM_AUTHORIZED_USER_IDS en .env (cp .env.example .env). Los secretos y la elección
# del modelo según la VRAM los genera el servicio init; sin .env también arranca, con
# Telegram desactivado y la interfaz web de OpenClaw en http://127.0.0.1:18789.
#
# ollama, openclaw, api y worker usan network_mode: host y se hablan por 127.0.0.1; el
# resto publica sus puertos solo en 127.0.0.1. Perfiles opcionales (COMPOSE_PROFILES):
# tailscale, livesync, pm, vault, deep, assistant, automation, webui, monitoring.
name: jarvis-local

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-env-file: &env-file
  - path: .env
    required: false

# Gestión de proyectos con OpenProject (docs/OPENPROJECT.md): tableros, tickets, Gantt,
# hitos y riesgos, manejados desde Telegram con el servidor MCP jarvis-pm.
# COMPOSE_PROFILES=pm (con tailscale se publica en https://<nombre>.ts.net:8445).
x-openproject: &openproject
  image: openproject/openproject:17.8.0-slim
  profiles: ["pm"]
  networks:
    - jarvis_internal
  entrypoint: ["/opt/jarvis/openproject-entrypoint.sh"]
  environment:
    OPENPROJECT_PORT: ${OPENPROJECT_PORT:-8090}
    OPENPROJECT_HTTPS_PORT: ${OPENPROJECT_HTTPS_PORT:-8445}
    OPENPROJECT_DEFAULT__LANGUAGE: ${OPENPROJECT_LANGUAGE:-es}
    OPENPROJECT_SEED_LOCALE: ${OPENPROJECT_LANGUAGE:-es}
    OPENPROJECT_SEED_ADMIN_USER_NAME: ${OPENPROJECT_ADMIN_NAME:-Administrador}
    OPENPROJECT_SEED_ADMIN_USER_PASSWORD_RESET: "false"
    OPENPROJECT_RAILS__CACHE__STORE: memcache
    OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache:11211
    # Sin servidor de edición colaborativa (hocuspocus): los documentos se editan de uno en uno.
    OPENPROJECT_COLLABORATIVE__EDITING__HOCUSPOCUS__URL: ""
    OPENPROJECT_HSTS: "false"
    # Correo saliente (avisos, invitaciones a reuniones con .ics): la misma cuenta que usa
    # Jarvis (MAIL_*, docs/EMAIL.md). openproject-entrypoint.sh la traduce a OpenProject.
    MAIL_PROVIDER: ${MAIL_PROVIDER:-imap}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM: ${MAIL_FROM:-}
    # Correo del admin humano: vacío = el de Jarvis (MAIL_FROM o MAIL_USERNAME).
    OPENPROJECT_ADMIN_MAIL: ${OPENPROJECT_ADMIN_MAIL:-}
    RAILS_MIN_THREADS: 4
    RAILS_MAX_THREADS: 16
  volumes:
    - ./infra/docker/openproject-entrypoint.sh:/opt/jarvis/openproject-entrypoint.sh:ro
    - openproject_assets:/var/openproject/assets
    - jarvis_runtime:/run/jarvis:ro
    - tailscale_info:/var/run/tailscale-info:ro
  logging: *logging

networks:
  jarvis_internal:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  jarvis_srv:
  # Secretos y modelos elegidos por init, leídos por el resto de servicios.
  jarvis_runtime:
  ollama_models:
  openclaw_state:
  tailscale_state:
  tailscale_socket:
  # Solo el nombre del nodo en el tailnet (dnsname), legible por cualquier servicio: el
  # directorio del socket es privado porque el socket permite controlar tailscaled.
  tailscale_info:
  couchdb_data:
  couchdb_config:
  livesync_bridge_config:
  livesync_bridge_state:
  openproject_assets:

services:
  # --- Arranque: secretos + modelos -------------------------------------------------
  init:
    image: jarvis-local:latest
    command: ["init"]
    user: "0:0"
    gpus: all
    env_file: *env-file
    volumes:
      - jarvis_runtime:/run/jarvis
      - tailscale_state:/var/lib/tailscale
      - tailscale_socket:/var/run/tailscale
      - tailscale_info:/var/run/tailscale-info
    restart: "no"
    logging: *logging

  ollama:
    image: ollama/ollama:0.34.0
    restart: unless-stopped
    network_mode: host
    gpus: all
    # El contexto sale de la elección de init (o de .env) para no reservar de más en GPUs
    # pequeñas o en CPU.
    entrypoint: ["/bin/sh", "-c", ". /run/jarvis/models.env && export OLLAMA_CONTEXT_LENGTH && exec /bin/ollama serve"]
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      # Peticiones simultáneas por modelo: el bot, el RAG y las secciones de un documento
      # (DOCGEN_CONCURRENCY) no se hacen cola entre sí.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
    volumes:
      - ${OLLAMA_MODELS_PATH:-ollama_models}:/root/.ollama/models
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *logging

  ollama-pull:
    image: ollama/ollama:0.34.0
    network_mode: host
    entrypoint: ["/bin/sh", "/opt/jarvis/ollama-pull.sh"]
    environment:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_PRUNE_UNUSED: ${OLLAMA_PRUNE_UNUSED:-false}
    volumes:
      - ./infra/docker/ollama-pull.sh:/opt/jarvis/ollama-pull.sh:ro
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # --- Aplicación ---------------------------------------------------------------------
  api:
    build: .
    image: jarvis-local:latest
    restart: unless-stopped
    network_mode: host
    command: ["api"]
    env_file: *env-file
    environment:
      JARVIS_API_HOST: "127.0.0.1"
      JARVIS_API_PORT: ${JARVIS_API_PORT:-8000}
    volumes:
      - jarvis_srv:/srv/jarvis
      - jarvis_runtime:/run/jarvis:ro
      # Nombre en el tailnet, para los enlaces a OpenProject del calendario.
      - tailscale_info:/var/run/tailscale-info:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('JARVIS_API_PORT','8000')+'/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *logging

  worker:
    image: jarvis-local:latest
    restart: unless-stopped
    network_mode: host
    # GPU para transcribir reuniones (faster-whisper, ~2 GB de VRAM junto al modelo de Ollama).
    gpus: all
    command: ["worker"]
    env_file: *env-file
    volumes:
      - jarvis_srv:/srv/jarvis
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "arq", "apps.worker.jarvis_worker.main.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

  # Modo profundo /deep (docs/AIRLLM.md): modelos mayores que la VRAM, capa a capa desde
  # disco. COMPOSE_PROFILES=...,deep y AIRLLM_ENABLED=true + AIRLLM_MODEL en .env. Los
  # shards van a jarvis_srv (models/airllm), fuera de las copias de seguridad.
  airllm:
    build:
      context: services/airllm
    image: jarvis-airllm:latest
    restart: unless-stopped
    profiles: ["deep"]
    network_mode: host
    gpus: all
    env_file: *env-file
    environment:
      AIRLLM_HOST: 127.0.0.1
      AIRLLM_PORT: "11500"
      AIRLLM_MODELS_DIR: /srv/jarvis/models/airllm
    volumes:
      - jarvis_srv:/srv/jarvis
    healthcheck:
      # Sano en cuanto responde: la carga del modelo (minutos u horas la primera vez) se
      # sigue en /health (status: checking, loading, ready).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:11500/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *logging

  openclaw:
    build:
      context: .
      dockerfile: integrations/openclaw/Dockerfile
    image: jarvis-openclaw:latest
    restart: unless-stopped
    network_mode: host
    # UID del dueño del estado si se reutiliza un ~/.openclaw existente (OPENCLAW_STATE_PATH).
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    env_file: *env-file
    environment:
      OPENCLAW_GATEWAY_PORT: "18789"
    volumes:
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/home/jarvis/.openclaw
      - jarvis_runtime:/run/jarvis:ro
      # Socket de tailscaled (perfil tailscale): el gateway publica la interfaz web con
      # `tailscale serve` y verifica la identidad de quien entra con `tailscale whois`.
      - tailscale_socket:/var/run/tailscale
    depends_on:
      tailscale:
        condition: service_healthy
        required: false
      api:
        condition: service_healthy
      searxng:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    stop_grace_period: 60s
    logging: *logging

  # --- Datos ----------------------------------------------------------------------------
  postgres:
    image: postgres:17.2-bookworm
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD_FILE: /run/jarvis/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7.4-bookworm
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  # Búsqueda web del agente (web_search de OpenClaw).
  searxng:
    image: searxng/searxng@sha256:11ffedd387dc9cf99e881250c67861470384e55194a86f76df76aa0034a28a1a
    restart: unless-stopped
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8888}:8080"
    entrypoint: ["/bin/sh", "-c", "export SEARXNG_SECRET=\"$$(cat /run/jarvis/searxng_secret)\" && exec /usr/local/searxng/entrypoint.sh"]
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:${SEARXNG_PORT:-8888}/"
    volumes:
      - ./infra/compose/searxng:/etc/searxng
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  # Red de conocimiento en el vault de Obsidian (docs/OBSIDIAN.md): empresas, proyectos,
  # personas, hitos, riesgos, reuniones y documentos como notas enlazadas.
  knowledge:
    image: jarvis-local:latest
    restart: unless-stopped
    profiles: ["vault", "livesync"]
    network_mode: host
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    command: ["python", "-m", "packages.knowledge.red", "--vault", "/state/wiki/main",
              "--every", "${KNOWLEDGE_REFRESH_SECONDS:-600}"]
    env_file: *env-file
    volumes:
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/state
      - jarvis_runtime:/run/jarvis:ro
      - tailscale_info:/var/run/tailscale-info:ro
    depends_on:
      api:
        condition: service_healthy
      openclaw:
        condition: service_started
    logging: *logging

  # --- Opcionales -----------------------------------------------------------------------
  # Vault de Obsidian en un repo git privado (docs/MEMORY.md): VAULT_GIT_URL y
  # VAULT_SSH_KEY_PATH en .env, y COMPOSE_PROFILES=vault.
  vault-sync:
    image: alpine/git:latest
    restart: unless-stopped
    profiles: ["vault"]
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/jarvis/vault-sync-loop.sh"]
    environment:
      HOME: /tmp
      JARVIS_VAULT_DIR: /state/wiki/main
      VAULT_GIT_URL: ${VAULT_GIT_URL:-}
      VAULT_SYNC_INTERVAL: ${VAULT_SYNC_INTERVAL:-300}
    volumes:
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/state
      - ./infra/docker/vault-sync-loop.sh:/opt/jarvis/vault-sync-loop.sh:ro
      - ./scripts/vault-sync:/scripts/vault-sync:ro
      - ${VAULT_SSH_KEY_PATH:-./vault_ssh_key}:/run/vault/id_key:ro
      # Usuario para JARVIS_UID generado por init: ssh no funciona sin él.
      - type: volume
        source: jarvis_runtime
        target: /etc/passwd
        read_only: true
        volume:
          subpath: passwd
    depends_on:
      openclaw:
        condition: service_started
    logging: *logging

  # Acceso a la interfaz web de OpenClaw desde tu tailnet por HTTPS
  # (https://<TAILSCALE_HOSTNAME>.<tailnet>.ts.net): TS_AUTHKEY en .env y
  # COMPOSE_PROFILES=tailscale. Ver docs/DOCKER.md.
  tailscale:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    profiles: ["tailscale"]
    network_mode: host
    # Mismo UID que openclaw: tailscaled solo deja configurar `serve` a su propio usuario.
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    entrypoint: ["/bin/sh", "/opt/jarvis/tailscale-entrypoint.sh"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-jarvis}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      LIVESYNC_HTTPS_PORT: ${LIVESYNC_HTTPS_PORT:-8443}
      COUCHDB_PORT: ${COUCHDB_PORT:-5984}
      OPENPROJECT_HTTPS_PORT: ${OPENPROJECT_HTTPS_PORT:-8445}
      OPENPROJECT_PORT: ${OPENPROJECT_PORT:-8090}
    volumes:
      - ./infra/docker/tailscale-entrypoint.sh:/opt/jarvis/tailscale-entrypoint.sh:ro
      - tailscale_state:/var/lib/tailscale
      - tailscale_socket:/var/run/tailscale
      - tailscale_info:/var/run/tailscale-info
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "tailscale", "--socket", "/var/run/tailscale/tailscaled.sock", "status"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    logging: *logging

  # Obsidian en el móvil y el portátil con Self-hosted LiveSync (docs/OBSIDIAN.md):
  # CouchDB publicado solo por Tailscale y livesync-bridge entre CouchDB y el vault.
  # COMPOSE_PROFILES=tailscale,livesync.
  couchdb:
    image: couchdb:3.5.2
    restart: unless-stopped
    profiles: ["livesync"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${COUCHDB_PORT:-5984}:5984"
    entrypoint: ["/bin/sh", "-c", "export COUCHDB_PASSWORD=\"$$(cat /run/jarvis/couchdb_password)\" && exec tini -- /docker-entrypoint.sh /opt/couchdb/bin/couchdb"]
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-jarvis}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - couchdb_config:/opt/couchdb/etc/local.d
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      # Tras livesync-init, CouchDB exige usuario también en /_up.
      test: ["CMD-SHELL", "curl -fsS -u \"$$COUCHDB_USER:$$(cat /run/jarvis/couchdb_password)\" http://127.0.0.1:5984/_up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  livesync-init:
    image: denoland/deno:2.6.9
    profiles: ["livesync"]
    networks:
      - jarvis_internal
    entrypoint: ["/bin/sh", "/opt/jarvis/livesync-init.sh"]
    environment:
      LIVESYNC_UTILS_REF: 85a12e311c8b5d2a56de402d5923508f2687d5b2
      COUCHDB_USER: ${COUCHDB_USER:-jarvis}
      LIVESYNC_DATABASE: ${LIVESYNC_DATABASE:-jarvis_vault}
      LIVESYNC_URL: ${LIVESYNC_URL:-}
      LIVESYNC_HTTPS_PORT: ${LIVESYNC_HTTPS_PORT:-8443}
      JARVIS_UID: ${JARVIS_UID:-1000}
      JARVIS_GID: ${JARVIS_GID:-1000}
    volumes:
      - ./infra/docker/livesync-init.sh:/opt/jarvis/livesync-init.sh:ro
      - jarvis_runtime:/run/jarvis
      - livesync_bridge_config:/bridge
      - livesync_bridge_state:/bridge-state
      - tailscale_socket:/var/run/tailscale:ro
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/state
    depends_on:
      couchdb:
        condition: service_healthy
      tailscale:
        condition: service_healthy
        required: false
    restart: "no"
    logging: *logging

  livesync-bridge:
    build:
      context: https://github.com/vrtmrz/livesync-bridge.git#c3760beaa0851214da4860903445d7f6420ca025
    image: jarvis-livesync-bridge:c3760be
    restart: unless-stopped
    profiles: ["livesync"]
    networks:
      - jarvis_internal
    # Mismo UID que OpenClaw para que las notas editadas desde Obsidian sigan siendo suyas.
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    environment:
      LSB_CONFIG: /bridge/config.json
      # Caché de Deno escribible con el UID de Jarvis (la de la imagen es del usuario deno);
      # incluye location_data, el registro de qué archivos ya se subieron.
      DENO_DIR: /bridge-state
    volumes:
      - livesync_bridge_config:/bridge:ro
      - livesync_bridge_state:/bridge-state
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/state
    tmpfs:
      # Repo git del vault y estado interno de memory-wiki: no se sincronizan con Obsidian.
      - /state/wiki/main/.git
      - /state/wiki/main/.openclaw-wiki
    depends_on:
      livesync-init:
        condition: service_completed_successfully
      openclaw:
        condition: service_started
    logging: *logging

  # Gestión de proyectos con OpenProject (docs/OPENPROJECT.md): x-openproject arriba.
  openproject-db-init:
    image: postgres:17.2-bookworm
    profiles: ["pm"]
    networks:
      - jarvis_internal
    entrypoint: ["/bin/sh", "/opt/jarvis/openproject-db-init.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - ./infra/docker/openproject-db-init.sh:/opt/jarvis/openproject-db-init.sh:ro
      - jarvis_runtime:/run/jarvis:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  openproject-cache:
    image: memcached:1.6.39-alpine
    restart: unless-stopped
    profiles: ["pm"]
    networks:
      - jarvis_internal
    logging: *logging

  # Migraciones, datos iniciales y aprovisionamiento de Jarvis (tipo Riesgo, usuario y
  # clave de API): se ejecuta y termina en cada arranque.
  openproject-setup:
    <<: *openproject
    command: ["bash", "-c", "./docker/prod/seeder && bundle exec rails runner /opt/jarvis/openproject-setup.rb"]
    volumes:
      - ./infra/docker/openproject-entrypoint.sh:/opt/jarvis/openproject-entrypoint.sh:ro
      - ./infra/docker/openproject-setup.rb:/opt/jarvis/openproject-setup.rb:ro
      - openproject_assets:/var/openproject/assets
      - jarvis_runtime:/run/jarvis:ro
      - tailscale_info:/var/run/tailscale-info:ro
    depends_on:
      openproject-db-init:
        condition: service_completed_successfully
      openproject-cache:
        condition: service_started
      tailscale:
        condition: service_healthy
        required: false
    restart: "no"

  openproject:
    <<: *openproject
    command: ["./docker/prod/web"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENPROJECT_PORT:-8090}:8080"
    depends_on:
      openproject-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: 127.0.0.1:${OPENPROJECT_PORT:-8090}", "-H", "X-Forwarded-Proto: https", "http://127.0.0.1:8080/health_checks/default"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # Una sola memoria: publica las notas del vault en la wiki de cada proyecto y copia al
  # vault las páginas de la wiki de OpenProject (infra/docker/openproject-wiki-sync.rb).
  openproject-wiki-sync:
    <<: *openproject
    command: ["bash", "-c", "bundle exec rails runner /opt/jarvis/openproject-wiki-sync.rb"]
    restart: unless-stopped
    # Dueño del vault (como vault-sync y knowledge), no el usuario app de la imagen.
    user: "${JARVIS_UID:-1000}:${JARVIS_GID:-1000}"
    environment:
      HOME: /tmp
      JARVIS_VAULT_DIR: /state/wiki/main
      WIKI_SYNC_INTERVAL: ${KNOWLEDGE_REFRESH_SECONDS:-600}
      OPENPROJECT_DEFAULT__LANGUAGE: ${OPENPROJECT_LANGUAGE:-es}
      OPENPROJECT_PORT: ${OPENPROJECT_PORT:-8090}
      OPENPROJECT_HTTPS_PORT: ${OPENPROJECT_HTTPS_PORT:-8445}
      OPENPROJECT_RAILS__CACHE__STORE: memcache
      OPENPROJECT_CACHE__MEMCACHE__SERVER: openproject-cache:11211
      OPENPROJECT_EMAIL__DELIVERY__METHOD: none
    volumes:
      - ./infra/docker/openproject-entrypoint.sh:/opt/jarvis/openproject-entrypoint.sh:ro
      - ./infra/docker/openproject-wiki-sync.rb:/opt/jarvis/openproject-wiki-sync.rb:ro
      - openproject_assets:/var/openproject/assets
      - jarvis_runtime:/run/jarvis:ro
      - tailscale_info:/var/run/tailscale-info:ro
      - ${OPENCLAW_STATE_PATH:-openclaw_state}:/state
    depends_on:
      openproject:
        condition: service_healthy

  openproject-worker:
    <<: *openproject
    command: ["./docker/prod/worker"]
    restart: unless-stopped
    depends_on:
      openproject-setup:
        condition: service_completed_successfully

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
    restart: unless-stopped
    profiles: ["assistant"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT:-5000}:5000"
    environment:
      BASE_URL: "http://127.0.0.1:${CHANGEDETECTION_PORT:-5000}"
    volumes:
      - ./infra/compose/changedetection:/datastore
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging

  n8n:
    image: n8nio/n8n:1.71.0
    restart: unless-stopped
    profiles: ["automation"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
    volumes:
      - ./infra/compose/n8n_data:/home/node/.n8n

  webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    restart: unless-stopped
    profiles: ["webui"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ANONYMIZED_TELEMETRY: "false"
      OFFLINE_MODE: "true"
    volumes:
      - ./infra/compose/webui_data:/app/backend/data
    logging: *logging

  prometheus:
    image: prom/prometheus:v3.0.1
    restart: unless-stopped
    profiles: ["monitoring"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    profiles: ["monitoring"]
    networks:
      - jarvis_internal
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./infra/monitoring/grafana:/var/lib/grafana
