[project]
name = "airllm-service"
version = "0.1.0"
description = "Servicio HTTP local de inferencia AirLLM para Jarvis Local"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "huggingface-hub>=0.26,<1",
    "psutil>=6.1,<8",
    "structlog>=24.4,<25",
]

[project.optional-dependencies]
runtime = [
    "airllm==2.11.0",
    "torch==2.6.0",
    "transformers==4.46.3",
    "accelerate>=1.2,<2",
    "optimum>=1.23,<2",
    "scipy>=1.14,<2",
    "sentencepiece>=0.2,<0.3",
    "protobuf>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
