[project]
name = "jarvis-local"
version = "0.1.0"
description = "Jarvis Local - asistente de IA privado con RAG, memoria y control por Telegram"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<0.31",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.2,<6",
    "qdrant-client>=1.12,<1.13",
    "httpx>=0.28,<0.29",
    "arq>=0.26,<0.27",
    "structlog>=24.4,<25",
    "python-multipart>=0.0.17",
    "tiktoken>=0.8,<0.9",
    "prometheus-client>=0.25.0",
    "python-magic>=0.4.27",
    "fastembed>=0.8.0",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "mcp>=1.28.1",
    "msal>=1.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<0.9",
    "pyright>=1.1.390",
    "httpx>=0.28,<0.29",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["apps", "packages", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core", "packages/rag", "packages/inference", "packages/documents", "packages/security", "packages/msgraph"]
