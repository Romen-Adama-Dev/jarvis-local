# Web estática de un editor de ArtCraft (ver Dockerfile). Los ficheros con hash en el
# nombre (.wasm y .js) no cambian nunca; index.html se revalida en cada visita.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    gzip_static on;

    add_header X-Content-Type-Options nosniff always;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
