# Alertas de Jarvis (docs/MONITORING.md). Alertmanager las envía por Telegram al
# propietario; sin Telegram configurado solo se ven en Prometheus y Grafana.
groups:
  - name: servicios
    rules:
      - alert: ServicioCaido
        expr: probe_success == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} no responde"
          description: "La sonda {{ $labels.job }} contra {{ $labels.instance }} falla desde hace 3 minutos."

      - alert: MetricasSinDatos
        expr: up{job!~"probe-.*"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sin métricas de {{ $labels.job }}"
          description: "Prometheus no puede leer {{ $labels.instance }} desde hace 5 minutos."

      - alert: ApiErrores5xx
        expr: |
          sum(rate(jarvis_http_requests_total{status=~"5.."}[10m]))
            / sum(rate(jarvis_http_requests_total[10m])) > 0.05
          and sum(rate(jarvis_http_requests_total[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "La API devuelve errores 5xx"
          description: "Más del 5 % de las peticiones a la API fallan con 5xx en los últimos 10 minutos."

  - name: servidor
    rules:
      - alert: DiscoCasiLleno
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Queda menos del 10 % de disco"
          description: "Libres {{ $value | humanizePercentage }} en /. Modelos, imágenes y copias de seguridad crecen: revisa `docker system df`."

      - alert: MemoriaBaja
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queda menos del 5 % de RAM"
          description: "Memoria disponible: {{ $value | humanizePercentage }}."

      - alert: GpuTemperaturaAlta
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU a {{ $value }} °C"
          description: "La GPU {{ $labels.gpu }} ({{ $labels.modelName }}) pasa de 85 °C desde hace 5 minutos."

      - alert: GpuErroresXid
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels:
          severity: critical
        annotations:
          summary: "Error Xid {{ $value }} en la GPU"
          description: "El driver de NVIDIA informa de un error Xid en {{ $labels.modelName }}: puede hacer falta reiniciar Ollama o el servidor."
