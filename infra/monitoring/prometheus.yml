# Prometheus de Jarvis (perfil monitoring, docs/MONITORING.md). Corre con network_mode:
# host y escucha solo en 127.0.0.1, igual que los exportadores, para llegar a los
# servicios que también usan la red del host (ollama, api, openclaw).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: jarvis-api
    file_sd_configs:
      - files: ["/etc/prometheus/targets/api.json"]

  - job_name: qdrant
    static_configs:
      - targets: ["127.0.0.1:6333"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  # Vacío sin GPU (MONITOR_GPU=false en compose.cpu.yml): si no, MetricasSinDatos
  # saltaría siempre por un dcgm-exporter que no está desplegado.
  - job_name: gpu
    file_sd_configs:
      - files: ["/etc/prometheus/targets/gpu.json"]

  # Sondas de disponibilidad: el arranque (prometheus-entrypoint.sh) escribe en
  # /etc/prometheus/targets solo los servicios de los perfiles activos, para no dar
  # por caído lo que no está desplegado.
  - job_name: probe-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/http.json"]
    relabel_configs: &probe-relabel
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: probe-ready
    metrics_path: /probe
    params:
      module: [http_ready]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/ready.json"]
    relabel_configs: *probe-relabel

  - job_name: probe-openproject
    metrics_path: /probe
    params:
      module: [http_openproject]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/openproject.json"]
    relabel_configs: *probe-relabel

  - job_name: probe-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: ["/etc/prometheus/targets/tcp.json"]
    relabel_configs: *probe-relabel
